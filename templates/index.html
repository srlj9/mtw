<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>My Movie Watchlist</title>
    <style>
        * {
            box-sizing: border-box;
        }
        :root {
            --bg: #F9E0D9;
            --text: #5D4954;
            --panel: #E6DBD0;
            --panel-text: #5D4954;
            --muted: #7D6167;
            --accent: #754F5B;
            --accent-hover: #5D4954;
            --card-bg: #E6DBD0;
            --card-border: #7D6167;
            --card-shadow: rgba(93,73,84,0.3);
        }
        body.dark-mode {
            --bg: #241419;
            --text: #F3D9D1;
            --panel: #3B2129;
            --panel-text: #F3D9D1;
            --muted: #B08893;
            --accent: #8A5C69;
            --accent-hover: #A97584;
            --card-bg: #3B2129;
            --card-border: #8A5C69;
            --card-shadow: rgba(0,0,0,0.5);
        }
        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Navbar */
        .navbar {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        .logo {
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            white-space: nowrap;
        }
        .nav-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        #lang-toggle, #theme-toggle, .login-btn {
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        #lang-toggle, #theme-toggle {
            background: var(--panel);
            color: var(--panel-text);
        }
        #lang-toggle:hover, #theme-toggle:hover {
            background: var(--muted);
            color: #FFFFFF;
        }
        .login-btn {
            background: var(--accent);
            color: #FFFFFF;
        }
        .login-btn:hover {
            background: var(--accent-hover);
        }

        /* Search */
        #search-input {
            width: 100%;
            max-width: 400px;
            padding: 10px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            background: var(--panel);
            color: var(--panel-text);
        }
        #search-input::placeholder {
            color: var(--muted);
        }

        /* Banner */
        #banner {
            position: relative;
            width: 100%;
            height: 400px;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 30px;
        }
        #banner-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.8s ease-in-out;
        }
        #banner-info {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            padding: 30px 20px 20px 20px;
        }
        #banner-title {
            font-size: 28px;
            margin: 0 0 8px 0;
            color: #FFFFFF;
        }
        #banner-overview {
            font-size: 14px;
            max-width: 600px;
            color: #ddd;
            margin: 0;
        }

        /* Loading */
        #loading-text {
            text-align: center;
            font-size: 18px;
            color: var(--muted);
        }

        /* Movie Cards */
        #movies-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }
        .movie-card {
            width: 200px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text);
            padding: 10px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.3s ease, box-shadow 0.3s ease, background-color 0.3s ease;
        }
        .movie-card:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px var(--card-shadow);
        }
        .movie-card img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            border-radius: 5px;
        }
        .movie-card h3 {
            font-size: 16px;
            margin: 8px 0 4px 0;
            height: 42px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }
        .movie-card p {
            margin: 0;
        }
        .add-btn {
            width: 100%;
            padding: 8px;
            margin-top: 8px;
            background: var(--accent);
            color: #FFFFFF;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .add-btn:hover {
            background: var(--accent-hover);
        }

        /* Responsive */
        @media (max-width: 600px) {
            .navbar {
                grid-template-columns: 1fr;
                text-align: center;
            }
            .nav-actions {
                justify-content: center;
            }
            #movies-container {
                justify-content: center;
            }
            .movie-card {
                width: 150px;
            }
            .movie-card img {
                height: 220px;
            }
            #banner {
                height: 250px;
            }
            #banner-title {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <input type="text" id="search-input" placeholder="🔍 Search for a movie..." onkeyup="filterMovies()">
        <div class="logo">🎬 MovieWatch</div>
        <div class="nav-actions">
            <button id="theme-toggle" onclick="toggleTheme()">🌙</button>
            <button id="lang-toggle" onclick="toggleLanguage()">🌐 EN / عربي</button>
            <button class="login-btn" onclick="window.location.href='/watchlist-page'">📌 My Watchlist</button>
            <button class="login-btn" id="login-nav-btn" onclick="window.location.href='/login'">👤 Login</button>
        </div>
    </nav>

    <div id="banner">
        <img id="banner-img" src="" alt="">
        <div id="banner-info">
            <h2 id="banner-title"></h2>
            <p id="banner-overview"></p>
        </div>
    </div>

    <p id="loading-text">⏳ Loading movies...</p>
    <div id="movies-container"></div>

    <script>
        // نتأكدو واش فما مستخدم داخل
        const userId = localStorage.getItem('user_id');
        const username = localStorage.getItem('username');

        if (userId) {
            document.getElementById('login-nav-btn').textContent = `👤 ${username}`;
            document.getElementById('login-nav-btn').onclick = function() {
                localStorage.removeItem('user_id');
                localStorage.removeItem('username');
                location.reload();
            };
        }

        let allMovies = [];
        let currentLang = 'en';
        let bannerIndex = 0;
        let bannerMovies = [];

        const translations = {
            en: {
                searchPlaceholder: "🔍 Search for a movie...",
                addButton: "+ Add to Watchlist",
                loading: "⏳ Loading movies...",
                login: "👤 Login"
            },
            ar: {
                searchPlaceholder: "🔍 ابحث عن فيلم...",
                addButton: "+ أضف للقائمة",
                loading: "⏳ جاري تحميل الأفلام...",
                login: "👤 تسجيل الدخول"
            }
        };

        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'ar' : 'en';
            updateTexts();
            displayMovies(allMovies);
        }

        function updateTexts() {
            const t = translations[currentLang];
            document.getElementById('search-input').placeholder = t.searchPlaceholder;
            // إذا المستخدم داخل، نخليو اسمو يبان (ماشي "Login")
            if (!userId) {
                document.getElementById('login-nav-btn').textContent = t.login;
            }
        }

        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            document.getElementById('theme-toggle').textContent = isDark ? '☀️' : '🌙';
        }

        fetch('/movies')
            .then(response => response.json())
            .then(data => {
                allMovies = data.results;
                document.getElementById('loading-text').style.display = 'none';
                displayMovies(allMovies);
                startBanner();
            })
            .catch(error => console.error('Error:', error));

        function displayMovies(movies) {
            const container = document.getElementById('movies-container');
            container.innerHTML = '';
            const t = translations[currentLang];

            movies.forEach(movie => {
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.innerHTML = `
                    <img src="https://image.tmdb.org/t/p/w200${movie.poster_path}" alt="${movie.title}">
                    <h3>${movie.title}</h3>
                    <p>⭐ ${movie.vote_average}</p>
                    <button class="add-btn" onclick="addToWatchlist(${movie.id}, '${movie.title.replace(/'/g, "\\'")}', '${movie.poster_path}')">
                        ${t.addButton}
                    </button>
                `;
                container.appendChild(card);
            });
        }

        function filterMovies() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const filtered = allMovies.filter(movie =>
                movie.title.toLowerCase().includes(query)
            );
            displayMovies(filtered);
        }

        function addToWatchlist(movieId, movieTitle, posterPath) {
            const userId = localStorage.getItem('user_id');

            if (!userId) {
                alert(currentLang === 'ar' ? '⚠️ سجل دخولك الأول!' : '⚠️ Please login first!');
                window.location.href = '/login';
                return;
            }

            fetch('/watchlist', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    user_id: parseInt(userId),
                    movie_id: movieId,
                    title: movieTitle,
                    poster_path: posterPath
                })
            })
            .then(response => response.json())
            .then(data => {
                const msg = currentLang === 'ar'
                    ? `✅ "${movieTitle}" تزادت للـ Watchlist!`
                    : `✅ "${movieTitle}" added to Watchlist!`;
                alert(msg);
            })
            .catch(error => console.error('Error:', error));
        }

        function startBanner() {
            bannerMovies = allMovies.slice(0, 5);
            showBannerMovie();
            setInterval(nextBannerMovie, 5000);
        }

        function showBannerMovie() {
            const movie = bannerMovies[bannerIndex];
            const img = document.getElementById('banner-img');
            img.style.opacity = 0;
            setTimeout(() => {
                img.src = `https://image.tmdb.org/t/p/original${movie.backdrop_path}`;
                document.getElementById('banner-title').textContent = movie.title;
                document.getElementById('banner-overview').textContent = movie.overview.slice(0, 150) + '...';
                img.style.opacity = 1;
            }, 400);
        }

        function nextBannerMovie() {
            bannerIndex = (bannerIndex + 1) % bannerMovies.length;
            showBannerMovie();
        }
    </script>
</body>
</html>
